# Production Profile Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# In Production, schema must be strictly validated against Flyway migrations
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway Migrations enforced in Production
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Security & Error hardening
server.error.include-stacktrace=never
server.error.include-message=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
security.encryption.secret-key=${ENCRYPTION_SECRET_KEY}

# Swagger / OpenAPI Disabled by default in Production
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

# Production Caching (Redis configured via REDIS_HOST/REDIS_PORT)
spring.cache.type=${CACHE_TYPE:redis}
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}

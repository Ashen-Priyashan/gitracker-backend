services:

  redis:
    image: redis:8-alpine
    container_name: gitracker-redis
    ports:
      - "6379:6379"

  postgres:
    image: postgres:17
    container_name: gitracker-postgres
    environment:
      POSTGRES_DB: gitracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
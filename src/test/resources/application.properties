# In-Memory Database for Testing
spring.datasource.url=jdbc:h2:mem:gitrackertest;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
# Flyway disabled during in-memory tests
spring.flyway.enabled=false

# Redis & Cache disabled during tests
spring.cache.type=none
spring.data.redis.host=localhost
spring.data.redis.port=6379
management.health.redis.enabled=false

# GitHub API mock properties
github.api.base-url=https://api.github.com
github.api.token=

# Token Encryption Test Key
security.encryption.secret-key=test_secret_key_32_characters_ok!

spring.application.name=gitracker-backend

# Active Profile (defaults to dev)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

server.port=8080
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# GitHub API Defaults
github.api.base-url=${GITHUB_API_BASE_URL:https://api.github.com}
github.api.token=${GITHUB_API_TOKEN:}
github.api.connect-timeout-seconds=${GITHUB_API_CONNECT_TIMEOUT_SECONDS:5}
github.api.read-timeout-seconds=${GITHUB_API_READ_TIMEOUT_SECONDS:10}

# GitHub App OAuth & Configuration
github.app.app-id=${GITHUB_APP_ID:}
github.app.client-id=${GITHUB_CLIENT_ID:}
github.app.client-secret=${GITHUB_CLIENT_SECRET:}
github.app.private-key=${GITHUB_PRIVATE_KEY:}
github.app.redirect-uri=${GITHUB_REDIRECT_URI:http://localhost:8080/api/github/callback}

# Application URLs
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Token Encryption (AES-256-GCM)
security.encryption.secret-key=${ENCRYPTION_SECRET_KEY:}

# Spring Boot Actuator & Health Probes
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Login Rate Limiting (Brute-Force & Credential-Stuffing Protection)
security.login-rate-limit.enabled=${LOGIN_RATE_LIMIT_ENABLED:true}
security.login-rate-limit.account.max-attempts=${LOGIN_RATE_LIMIT_ACCOUNT_MAX_ATTEMPTS:5}
security.login-rate-limit.account.window-seconds=${LOGIN_RATE_LIMIT_ACCOUNT_WINDOW_SECONDS:300}
security.login-rate-limit.ip.max-attempts=${LOGIN_RATE_LIMIT_IP_MAX_ATTEMPTS:20}
security.login-rate-limit.ip.window-seconds=${LOGIN_RATE_LIMIT_IP_WINDOW_SECONDS:300}
security.login-rate-limit.redis-failure-policy=${LOGIN_RATE_LIMIT_REDIS_FAILURE_POLICY:FAIL_CLOSED}

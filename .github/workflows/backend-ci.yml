name: Backend CI

on:
  push:
    branches:
      - develop
      - main
      - "feat/**"
      - "feature/**"
      - "fix/**"
      - "chore/**"
      - "test/**"

  pull_request:
    branches:
      - develop
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: gitracker
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gitracker"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379

    env:
      MAVEN_OPTS: "-Xms128m -Xmx512m"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Run test suite
        run: ./mvnw clean test -DargLine="-Xmx384m"

      - name: Verify production package build
        run: ./mvnw package -DskipTests